# FORK-ONLY workflow -- not part of any upstream PR (exclude this commit when
# cherry-picking for upstream).
#
# Builds the wheel in a controlled environment from the IMMUTABLE yarn.lock.
# Exists because building the labextension with jlpm inside the deployment's
# Docker image resolved a dependency tree that diverged from the release build
# (the bundle demanded @jupyter/ydoc ^1.0.2 as a shared singleton where the
# stock bundle demands nothing) -- structurally valid, broken at runtime risk.
# The wheel this workflow attaches to the tag's GitHub Release is what the
# image pip-installs: prebuilt labextension, no node needed at image build.
name: Fork wheel
on:
  push:
    branches: ["darden/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: Verify the bundle carries no divergent shared-module requirements
        run: |
          python - <<'EOF'
          import glob, json, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          z = zipfile.ZipFile(whl)
          cands = [n for n in z.namelist()
                   if "/labextensions/" in n and n.endswith("/package.json")
                   and "static" not in n]
          if not cands:
              sys.exit("FAILED: no labextension package.json in the wheel -- "
                       "the prebuilt frontend is missing entirely")
          pkg = sorted(cands, key=len)[0]
          meta = json.loads(z.read(pkg))
          entry = meta["jupyterlab"]["_build"]["load"]
          bundle = z.read(pkg.rsplit("package.json", 1)[0] + entry).decode("utf-8", "replace")
          if "1.0.2" in bundle:
              sys.exit("FAILED: divergent @jupyter/ydoc ^1.0.2 requirement in the bundle")
          print(f"OK {whl}  labext={meta['version']}  entry={entry}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
      - name: Attach wheel to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --prerelease \
                 --notes "Fork build from branch darden/fixes; wheel ships the CI-built labextension."
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
